<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Monitoring Akademik | UNTAG Surabaya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #ffffff; color: #1e293b; }
        .input-box { transition: all 0.2s ease; border: 1px solid #e2e8f0; }
        .input-box:focus { border-color: #10b981; outline: none; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.05); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-50/50">

    <div class="max-w-md w-full bg-white rounded-[2.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.02)] border border-slate-100 p-10">
        
        <!-- Header -->
        <header class="text-center mb-10">
            <h1 class="text-2xl font-extrabold tracking-tight text-slate-800">Analisis Performa</h1>
            <p class="text-emerald-600 text-[10px] font-bold uppercase tracking-[0.3em] mt-1">Sistem Peringatan Dini</p>
        </header>

        <!-- Form -->
        <form id="prediksiForm" action="/predict" method="post" class="space-y-6">
            <div class="space-y-5">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1 mb-2">Nilai G1</label>
                    <input type="number" id="input_g1" name="G1" step="0.1" max="20" min="0" placeholder="Skala 0 - 20" required
                        class="w-full px-5 py-4 bg-slate-50 rounded-2xl text-slate-700 font-medium input-box">
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1 mb-2">Nilai G2</label>
                    <input type="number" id="input_g2" name="G2" step="0.1" max="20" min="0" placeholder="Skala 0 - 20" required
                        class="w-full px-5 py-4 bg-slate-50 rounded-2xl text-slate-700 font-medium input-box">
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1 mb-2">Total Absensi</label>
                    <input type="number" id="input_abs" name="absences" min="0" placeholder="Jumlah hari" required
                        class="w-full px-5 py-4 bg-slate-50 rounded-2xl text-slate-700 font-medium input-box">
                </div>
            </div>

            <button type="submit" onclick="simpanInput()"
                class="w-full bg-slate-900 hover:bg-emerald-600 text-white font-bold py-4 rounded-2xl transition-all shadow-lg shadow-slate-100 mt-4 active:scale-[0.98]">
                Analisis Status Siswa
            </button>
        </form>

        <!-- HASIL & RINGKASAN DATA (Muncul Otomatis) -->
        {% if prediction_text %}
        <div id="hasilSection" class="mt-12 pt-8 border-t border-slate-50 space-y-6 animate-in fade-in duration-700">
            
            <!-- Tampilan Ringkasan Data -->
            <div class="grid grid-cols-3 gap-3">
                <div class="bg-slate-50/50 p-3 rounded-2xl text-center border border-slate-100">
                    <p class="text-[8px] font-bold text-slate-400 uppercase tracking-widest mb-1">G1</p>
                    <p id="show_g1" class="text-sm font-bold text-slate-700">-</p>
                </div>
                <div class="bg-slate-50/50 p-3 rounded-2xl text-center border border-slate-100">
                    <p class="text-[8px] font-bold text-slate-400 uppercase tracking-widest mb-1">G2</p>
                    <p id="show_g2" class="text-sm font-bold text-slate-700">-</p>
                </div>
                <div class="bg-slate-50/50 p-3 rounded-2xl text-center border border-slate-100">
                    <p class="text-[8px] font-bold text-slate-400 uppercase tracking-widest mb-1">Absen</p>
                    <p id="show_abs" class="text-sm font-bold text-slate-700">-</p>
                </div>
            </div>

            <!-- Badge Hasil -->
            <div class="text-center">
                <p class="text-[9px] font-bold text-slate-300 uppercase tracking-[0.4em] mb-3">Kesimpulan</p>
                <div class="inline-block px-10 py-3 rounded-full text-lg font-black tracking-tight border
                    {% if 'BERISIKO' in prediction_text %} 
                        bg-rose-50 text-rose-600 border-rose-100
                    {% else %} 
                        bg-emerald-50 text-emerald-600 border-emerald-100
                    {% endif %}">
                    {{ prediction_text.split(': ')[1] }}
                </div>
                <p class="mt-4 text-[10px] text-slate-400 italic font-medium leading-relaxed">
                    *Analisis dilakukan secara otomatis menggunakan parameter SVM.
                </p>
            </div>
        </div>
        {% endif %}
    </div>

    <footer class="mt-12 text-center text-slate-300">
        <p class="text-[10px] font-bold uppercase tracking-[0.2em]">
            Informatika UNTAG Surabaya &copy; 2026
        </p>
    </footer>

    <!-- JAVASCRIPT UNTUK MENAMPILKAN ULANG INPUT TANPA UBAH APP.PY -->
    <script>
        function simpanInput() {
            localStorage.setItem('g1', document.getElementById('input_g1').value);
            localStorage.setItem('g2', document.getElementById('input_g2').value);
            localStorage.setItem('abs', document.getElementById('input_abs').value);
        }

        window.onload = function() {
            if (document.getElementById('hasilSection')) {
                document.getElementById('show_g1').innerText = localStorage.getItem('g1') || '-';
                document.getElementById('show_g2').innerText = localStorage.getItem('g2') || '-';
                document.getElementById('show_abs').innerText = (localStorage.getItem('abs') || '-') + ' hari';
            }
        }
    </script>

</body>
</html>
